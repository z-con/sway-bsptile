# hyprlock -- replaces gtklock (which replaced swaylock). Matches the rest of
# sway-bsptile (purple accent #9d4edd, dark translucent #1c1c20, Ubuntu Sans).
#
# The fingerprint reader is wired through hyprlock's own native `auth.fingerprint`
# block below, NOT through PAM's pam_fprintd (see ../../config/pam.d/hyprlock in
# this repo, deployed to /etc/pam.d/hyprlock) -- hyprlock talks to fprintd
# directly and in *parallel* with the password field, instead of PAM trying
# fingerprint first and making every password check sit through its timeout
# before even looking at what you typed. $FPRINTPROMPT below is what actually
# tells you a scan is happening/expected -- that's the fix for "is fingerprint
# even an option here."

$font = Ubuntu Sans

general {
    hide_cursor = false
    ignore_empty_input = true
}

auth {
    pam {
        enabled = true
    }
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint or type your password
        present_message = Reading fingerprint...
        retry_delay = 250
    }
}

animations {
    enabled = true
    bezier = easeOutCubic, 0.33, 1, 0.68, 1
    animation = fadeIn, 1, 3, easeOutCubic
    animation = fadeOut, 1, 3, easeOutCubic
    animation = inputFieldColors, 1, 2, easeOutCubic
    animation = inputFieldFade, 1, 2, easeOutCubic
}

# Live blurred screenshot of the desktop, same idea as GNOME's lock screen,
# plus a theme-color tint (same 35% #1c1c20 tint the old swaylock/gtklock
# static background used) so text stays legible over whatever's behind it.
background {
    monitor =
    path = screenshot
    color = rgba(28, 28, 32, 1.0)
    blur_passes = 3
    blur_size = 7
}
shape {
    monitor =
    size = 100%, 100%
    color = rgba(28, 28, 32, 0.35)
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 0
}

# Avatar (AccountsService) + real name
image {
    monitor =
    path = /var/lib/AccountsService/icons/zach
    size = 110
    rounding = -1
    border_size = 3
    border_color = rgba(157, 78, 221, 0.9)
    position = 0, 195
    halign = center
    valign = center
    zindex = 1
}
label {
    monitor =
    text = $DESC
    color = rgba(255, 255, 255, 1.0)
    font_size = 20
    font_family = $font
    position = 0, 130
    halign = center
    valign = center
    zindex = 1
}

# Clock + date
label {
    monitor =
    text = $TIME12
    color = rgba(255, 255, 255, 1.0)
    font_size = 64
    font_family = $font
    position = 0, 40
    halign = center
    valign = center
    zindex = 1
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(207, 207, 207, 1.0)
    font_size = 14
    font_family = $font
    position = 0, -15
    halign = center
    valign = center
    zindex = 1
}

# Fingerprint status -- the whole point of switching to hyprlock. Always
# visible so it's never ambiguous whether scanning is an option right now.
label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(157, 78, 221, 1.0)
    font_size = 13
    font_family = $font
    position = 0, -50
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 3
    dots_size = 0.3
    dots_spacing = 0.3
    rounding = -1
    inner_color = rgba(20, 20, 24, 0.9)
    font_color = rgba(232, 232, 232, 1.0)
    font_family = $font

    outer_color = rgba(157, 78, 221, 0.9)
    check_color = rgba(157, 78, 221, 0.9)
    check_text = Verifying...
    fail_color = rgba(214, 69, 65, 0.9)
    # Default fail_text ("$FAIL ($ATTEMPTS)") already covers wrong-password
    # AND fingerprint failures (via $FAIL) plus a running attempt count.
    capslock_color = rgba(229, 192, 123, 0.9)

    placeholder_text = <i>Enter password...</i>
    fade_on_empty = false

    position = 0, -110
    halign = center
    valign = center
    zindex = 1
}

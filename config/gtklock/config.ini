# gtklock -- replaces swaylock. Unlike swaylock this can actually show who's
# being unlocked, a clock, and PAM's own conversation messages (which is what
# makes the fingerprint reader legible: pam_fprintd's "place your finger on
# the reader" / failure prompts come through as PAM_TEXT_INFO/PAM_ERROR_MSG
# and gtklock renders those as dismissible banners automatically -- nothing
# to configure for that part). "Caps Lock is on" and "Login failed" are also
# built in, no config needed.
[main]
# Absolute paths -- gtklock's config loader does not expand `~`.
style=/home/zach/.config/gtklock/style.css
modules=userinfo-module
time-format=%-I:%M %p
date-format=%A, %B %-d
background=/home/zach/.cache/sway-bsptile/lock-bg.png
